; AdultPixScan Configuration
; Store your OpenRouter API Key here.
; IMPORTANT: Ensure this file is NOT publicly accessible via web server!
; You might need to configure your web server (e.g., Nginx, Apache)
; to deny direct access to .ini files.
; Example Nginx rule:
; location ~ /\.ini$ {
;    deny all;
; }

; API 密钥配置
api_key = "your_api_key"

; 代理配置
use_proxy = false
proxy_url = "http://127.0.0.1:10809"

; IPv4/IPv6 配置
force_ipv4 = true

; 模型配置
model_name = "google/gemini-2.5-flash-preview"

; 超时配置（秒）
timeout = 180
connect_timeout = 30

; API 端点配置
; 可以在这里配置备用 API 端点，如果主端点不可用
api_endpoint = "https://openrouter.ai/api/v1/chat/completions"
; 备用端点（如果有）
api_endpoint_backup = "https://api.openrouter.ai/api/v1/chat/completions"

; 图片备份配置
; 警告：启用图片备份可能存在安全风险，请确保备份目录不可从Web访问
; 建议在生产环境中禁用此功能，或将备份目录设置在Web根目录之外
enable_image_backup = true
image_backup_dir = "image_backups"

; 安全配置
; 是否对上传的文件进行严格的内容验证（检查文件头）
strict_file_validation = true