<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老司机鉴•黄🔞中心</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>老司机鉴•黄🔞中心</h1>
            <p>上传图片，AI 分析其内容安全风险</p>
            <p>老司机😡也会定期<strong>看看</strong>有没有<strong><span style="font-size: larger;">漏网之鱼</span></strong>🐟</p>
        </header>

        <main>
            <div class="upload-section">
                <label for="imageUpload" class="upload-button">选择图片</label>
                <input type="file" id="imageUpload" accept="image/jpeg, image/png, image/webp, image/gif">
                <span id="fileName">未选择文件</span>
            </div>

            <div class="preview-section">
                <h2>预览</h2>
                <div id="imagePreviewContainer">
                    <img id="imagePreview" src="#" alt="图片预览" style="display: none;">
                    <p id="previewPlaceholder">请先选择一张图片</p>
                </div>
            </div>

            <div class="scan-button-container">
                <button id="scanButton" disabled>开始分析</button>
            </div>

            <div class="results-section" style="display: none;">
                <h2>分析结果</h2>
                <div id="loadingIndicator" style="display: none;">
                    <div class="spinner"></div>
                    <p>正在分析中，请稍候... (可能需要5-15秒)</p>
                </div>
                <div id="errorDisplay" class="error-message" style="display: none;"></div>
                <div id="resultContent" style="display: none;">
                     <div class="result-item">
                        <h3>风险概率</h3>
                        <div class="probability-indicator">
                            <span id="probabilityText">--%</span>
                        </div>
                    </div>
                    <div class="result-item">
                        <h3>AI 判断依据</h3>
                        <p id="reasoningText">--</p>
                    </div>
                    <div class="result-item">
                        <h3>是否包含成人内容</h3>
                        <p id="isAdultText">--</p>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p> 老司机图片审查 &copy; 2025 - OpenRouter 提供 AI 支持</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
